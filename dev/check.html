<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conjure · component check</title>
    <style>
      body { margin: 16px; background: #edf0e5; color: #20362c; font: 13px system-ui; }
      #stage { width: 360px; height: 360px; }
      #sheet { display: grid; grid-template-columns: repeat(auto-fill, 240px); gap: 10px; margin-top: 12px; }
      figure { margin: 0; }
      figure img { width: 240px; height: 240px; display: block; }
      figcaption { font-size: 11px; line-height: 1.3; overflow-wrap: anywhere; }
      .failed { color: #a3261c; }
    </style>
  </head>
  <body>
    <h1 id="title">Component check</h1>
    <p id="status">Starting…</p>
    <canvas id="stage"></canvas>
    <div id="sheet"></div>
    <script type="module" src="./check.ts"></script>
  </body>
</html>
