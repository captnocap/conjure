<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conjure · Atelier port check</title>
    <style>
      body { margin: 18px; background: #f1eee4; color: #222b27; font: 13px system-ui; }
      h1 { margin: 0 0 8px; font-size: 21px; }
      #status { min-height: 20px; }
      #stage { width: 240px; height: 240px; }
      #sheet { display: grid; grid-template-columns: repeat(6, 180px); gap: 10px; margin-top: 12px; }
      figure { margin: 0; break-inside: avoid; }
      figure canvas { width: 180px; height: 180px; display: block; }
      figcaption { font-size: 11px; line-height: 1.35; overflow-wrap: anywhere; }
      .failed { color: #a3261c; }
    </style>
  </head>
  <body>
    <h1 id="title">Atelier port conformance</h1>
    <p id="status">Loading the offline catalogue…</p>
    <canvas id="stage"></canvas>
    <div id="sheet"></div>
    <script type="module" src="./atelier-check.ts"></script>
  </body>
</html>
