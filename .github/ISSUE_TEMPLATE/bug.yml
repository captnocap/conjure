name: Bug
description: Something in the studio, a check or the engine does not work.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, the error text, and what you expected.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version, OS, browser
      placeholder: Node 22.12, Debian 13, Firefox 143
